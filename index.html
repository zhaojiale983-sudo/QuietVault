<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6e8bd"><meta name="description" content="QuietVault 私人资料收藏空间">
<link rel="manifest" href="./manifest.webmanifest">
<title>QuietVault · 私人收藏小屋</title>
<style>
:root{--bg:#fbf6e9;--paper:#fffdf7;--butter:#f5e7bd;--gold:#d8b86d;--ink:#554a37;--muted:#998b72;--line:#eadfc8;--pink:#f3d9d3;--green:#dce8d5;--shadow:0 8px 25px #806b3a12}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(#e8d8ad45 1px,transparent 1px) 0 0/18px 18px,var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:9px 13px}button.primary{background:var(--gold);border-color:var(--gold);color:#fff}button.ghost{background:transparent}.wrap{max-width:1120px;margin:auto;padding:22px 18px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:16px;background:var(--butter);display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}h1{font-size:21px;margin:0}small,.muted{color:var(--muted)}.hero{background:linear-gradient(120deg,#fff9e9,#f5e8c6);border:1px solid var(--line);border-radius:25px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"✿";position:absolute;right:24px;top:2px;font-size:70px;color:#d8b86d55}.hero h2{margin:0 0 4px;font-size:23px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.toolbar input{flex:1;min-width:180px}.field,input,textarea,select{width:100%;background:#fffefa;border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}.field:focus,input:focus,textarea:focus{border-color:var(--gold)}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}.tabs button{white-space:nowrap}.tabs .active{background:var(--butter);border-color:var(--gold)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}.sectionhead h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow);min-width:0}.card h3{margin:0 0 5px;font-size:16px;overflow-wrap:anywhere}.card p{margin:6px 0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.cardtop{display:flex;align-items:center;gap:10px}.ico{width:40px;height:40px;flex:none;border-radius:13px;background:var(--butter);display:grid;place-items:center;font-size:21px;overflow:hidden}.ico img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:13px;padding:6px 9px}.pill{display:inline-block;background:#f7efd9;color:#8b7650;border-radius:30px;padding:3px 9px;font-size:12px;margin:3px 4px 0 0}.empty{text-align:center;padding:42px 15px;color:var(--muted);background:#fffdf780;border:1px dashed var(--line);border-radius:20px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fffdf2ed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:9px max(10px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));overflow:auto}.bottom button{border:0;background:transparent;min-width:64px;font-size:12px;padding:7px}.bottom button.active{background:var(--butter)}.bottom span{display:block;font-size:19px}.modal{position:fixed;inset:0;background:#3c332a66;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{background:var(--paper);border-radius:22px;padding:19px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #33271144}.dialog h2{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .wide{grid-column:1/-1}label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.formrow{margin:10px 0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.hidden{display:none!important}.auth{max-width:430px;margin:8vh auto;padding:22px}.auth .card{padding:24px}.notice{padding:10px 13px;background:#f8efd7;border-radius:12px;color:#816d45;margin:10px 0}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.subtabs button{font-size:13px;padding:6px 10px}.subtabs button.active{background:var(--butter)}.preview{font-size:25px;line-height:1.7;padding:18px;background:#fff9e8;border-radius:15px;overflow-wrap:anywhere}
@media(max-width:600px){.wrap{padding:14px 12px 100px}.hero{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:11px}.card h3{font-size:14px}.card p{font-size:13px}.actions button{font-size:12px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.bottom{justify-content:flex-start}.top{margin-bottom:13px}}
</style></head><body>
<div id="auth" class="auth"><div class="card"><div class="brand"><div class="logo">🌼</div><div><h1>QuietVault</h1><small>把重要的东西，安静地收好</small></div></div><div class="notice">首次使用请填写原有 Supabase 项目的 URL 与 Publishable/anon key。配置只保存在当前浏览器。</div><div class="formrow"><label>Supabase Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div><div class="formrow"><label>Supabase Publishable / anon key</label><input id="cfgKey" placeholder="公开 anon / publishable key"></div><button class="primary" style="width:100%" onclick="saveConfig()">保存连接</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="formrow"><label>邮箱</label><input id="email" type="email" autocomplete="username"></div><div class="formrow"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="primary" style="flex:1" onclick="authAction('login')">登录</button><button style="flex:1" onclick="authAction('signup')">注册</button></div><p id="authMsg" class="muted"></p></div></div>
<div id="app" class="hidden"><div class="wrap"><header class="top"><div class="brand"><div class="logo">🌼</div><div><h1>QuietVault</h1><small id="userLabel">私人收藏小屋</small></div></div><button onclick="logout()">退出</button></header>
<section class="hero"><h2>欢迎回来 ✿</h2><div class="muted">给喜欢的东西留一个安静的位置。</div><div class="toolbar"><input id="search" placeholder="搜索名称、内容、标签…" oninput="render()"><button onclick="openSettings()">⚙ 设置</button></div></section>
<div class="tabs" id="tabs"></div><div id="subtabs" class="subtabs"></div><div class="sectionhead"><h2 id="sectionTitle">全部收藏</h2><button class="primary" onclick="addItem()">＋ 添加</button></div><div id="content"></div></div><nav class="bottom" id="bottom"></nav></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><h2 id="modalTitle">添加</h2><div id="modalBody"></div><div class="modalfoot"><button onclick="closeModal()">取消</button><button class="primary" id="saveBtn" onclick="saveItem()">保存</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KINDS=[['all','全部','✿'],['phone','小手机','📱'],['api','API','🔑'],['worldbook','世界书','📚'],['persona','人设卡','🎭'],['font','字体','🔤']];
const $=id=>document.getElementById(id);let sb=null,user=null,items=[],current='all',editing=null,subcat='全部',fontUrls={};
function cfg(){return {url:localStorage.getItem('qv_url')||'',key:localStorage.getItem('qv_key')||''}}
function saveConfig(){let u=$('cfgUrl').value.trim(),k=$('cfgKey').value.trim();if(!u||!k){$('authMsg').textContent='请填写项目 URL 和公开 anon/publishable key';return}localStorage.setItem('qv_url',u);localStorage.setItem('qv_key',k);initClient();$('authMsg').textContent='连接配置已保存，请登录。'}
function initClient(){let c=cfg();if(c.url&&c.key&&window.supabase)sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}})}
async function authAction(mode){initClient();if(!sb){$('authMsg').textContent='请先配置 Supabase 连接';return}let email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('authMsg').textContent='请填写邮箱和密码';return}$('authMsg').textContent='正在连接…';let r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(r.error){$('authMsg').textContent=r.error.message;return}if(mode==='signup'&&!r.data.session){$('authMsg').textContent='注册成功，请检查邮箱确认后登录。';return}user=r.data.user;await enterApp()}
async function enterApp(){if(!sb)return;let r=await sb.auth.getUser();if(r.error||!r.data.user){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}user=r.data.user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=user.email||'私人收藏小屋';await loadItems()}
async function logout(){await sb?.auth.signOut();user=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
async function loadItems(){let r=await sb.from('vault_items').select('*').order('updated_at',{ascending:false});if(r.error){$('content').innerHTML='<div class="notice">读取失败：'+esc(r.error.message)+'。请确认原有 vault_items 表及 RLS 策略。</div>';return}items=r.data||[];render()}
function meta(x){return x.metadata&&typeof x.metadata==='object'?x.metadata:{}}
function kindLabel(k){return KINDS.find(x=>x[0]===k)?.[1]||k}
function render(){let q=$('search')?.value?.toLowerCase()||'';let arr=items.filter(x=>(current==='all'||x.kind===current)&&(!q||[x.title,x.content,x.category,x.folder,JSON.stringify(x.tags||[]),JSON.stringify(meta(x))].join(' ').toLowerCase().includes(q)));let cats=[...new Set(arr.map(x=>x.category).filter(Boolean))];$('tabs').innerHTML=KINDS.map(x=>`<button class="${current===x[0]?'active':''}" onclick="current='${x[0]}';subcat='全部';render()">${x[2]} ${x[1]}</button>`).join('');$('bottom').innerHTML=KINDS.filter(x=>x[0]!=='all').map(x=>`<button class="${current===x[0]?'active':''}" onclick="current='${x[0]}';subcat='全部';render()"><span>${x[2]}</span>${x[1]}</button>`).join('');$('sectionTitle').textContent=kindLabel(current==='all'?'all':current);$('subtabs').innerHTML=['全部',...cats].map(c=>`<button class="${subcat===c?'active':''}" onclick="subcat=${JSON.stringify(c)};render()">${esc(c)}</button>`).join('')+(current==='worldbook'||current==='persona'?'<button onclick="newCategory()">＋分类</button>':'');if(subcat!=='全部')arr=arr.filter(x=>x.category===subcat);$('content').innerHTML=arr.length?'<div class="grid">'+arr.map(card).join('')+'</div>':'<div class="empty">🌷<br>这里还空着<br><button class="primary" style="margin-top:12px" onclick="addItem()">＋ 添加第一条</button></div>'}
function card(x){let m=meta(x),icon=m.icon?`<img src="${esc(m.icon)}">`:({phone:'📱',api:'🔑',worldbook:'📚',persona:'🎭',font:'🔤'}[x.kind]||'✿');return `<article class="card"><div class="cardtop"><div class="ico">${icon}</div><div style="min-width:0"><h3>${esc(x.title||'未命名')}</h3><small>${kindLabel(x.kind)} · ${esc(x.category||'未分类')}</small></div></div><p>${esc((x.content||m.url||m.siteUrl||'').slice(0,150))}</p>${(x.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}<div class="actions"><button onclick="editItem('${x.id}')">编辑</button><button onclick="copyItem('${x.id}')">复制</button><button onclick="toggleFav('${x.id}')">${m.favorite?'★':'☆'}</button>${x.kind==='phone'||x.kind==='api'?`<button onclick="openExternal('${x.id}')">打开</button>`:''}${x.kind==='font'?`<button onclick="previewFont('${x.id}')">预览</button>`:''}<button onclick="deleteItem('${x.id}')">删除</button></div></article>`}
function fields(kind,m,x){let common=`<div class="formrow"><label>名称</label><input id="f_title" value="${esc(x?.title||'')}" required></div><div class="formrow"><label>分类</label><input id="f_category" value="${esc(x?.category||'')}" placeholder="可留空"></div><div class="formrow"><label>标签（逗号分隔）</label><input id="f_tags" value="${esc((x?.tags||[]).join(','))}"></div>`;let html=common;
if(kind==='phone')html+=`<div class="formrow"><label>链接</label><input id="f_url" value="${esc(m.url||'')}" placeholder="https://"></div><div class="formrow"><label>密码（建议仅在可信设备保存）</label><input id="f_password" value="${esc(m.password||'')}"></div><div class="formrow"><label>费用</label><select id="f_price"><option ${m.price==='免费'?'selected':''}>免费</option><option ${m.price==='付费'?'selected':''}>付费</option></select></div><div class="formrow"><label>打开方式</label>${browserSelect(m.browser)}</div><div class="formrow"><label>图标 URL（可选）</label><input id="f_icon" value="${esc(m.icon||'')}"></div>`;
if(kind==='api')html+=`<div class="formrow"><label>站子名称</label><input id="f_siteName" value="${esc(m.siteName||'')}"></div><div class="formrow"><label>站子网址</label><input id="f_siteUrl" value="${esc(m.siteUrl||'')}" placeholder="https://"></div><div class="formrow"><label>密码</label><input id="f_password" value="${esc(m.password||'')}"></div><div class="formrow"><label>URL</label><input id="f_url" value="${esc(m.url||'')}"></div><div class="formrow"><label>密钥</label><input id="f_secret" value="${esc(m.secret||'')}"></div><div class="formrow"><label>打开浏览器</label>${browserSelect(m.browser)}</div>`;
if(kind==='worldbook'||kind==='persona')html+=`<div class="formrow"><label>内容 / 简介 / 正文</label><textarea id="f_content" rows="7">${esc(x?.content||'')}</textarea></div><div class="formrow"><label>作者 / 来源</label><input id="f_author" value="${esc(m.author||'')}"></div><div class="formrow"><label>关联世界书 ID（人设卡可填多个，逗号分隔）</label><input id="f_links" value="${esc((m.links||[]).join(','))}"></div><div class="formrow"><label>导入文件</label><input id="f_file" type="file" accept=".json,.txt,.md,.xml,.yaml,.yml,.png,.charx,.zip"></div>`;
if(kind==='font')html+=`<div class="formrow"><label>字体文件（TTF / OTF / WOFF / WOFF2）</label><input id="f_file" type="file" accept=".ttf,.otf,.woff,.woff2"></div><div class="formrow"><label>预览文字</label><input id="f_content" value="${esc(x?.content||'你好 QuietVault 123 ABC，。！？')}"></div>`;
if(!['phone','api','worldbook','persona','font'].includes(kind))html+=`<div class="formrow"><label>内容</label><textarea id="f_content" rows="6">${esc(x?.content||'')}</textarea></div>`;
return html}
function browserSelect(v){return `<select id="f_browser">${['系统默认','QQ浏览器','Edge','Chrome','X浏览器','雨见浏览器','永恒浏览器','其他'].map(a=>`<option ${v===a?'selected':''}>${a}</option>`).join('')}</select>`}
function addItem(){editing=null;let kind=current==='all'?'phone':current;$('modalTitle').textContent='添加'+kindLabel(kind);$('modalBody').innerHTML=`<div class="formrow"><label>类型</label><select id="f_kind" onchange="changeKind()">${KINDS.filter(x=>x[0]!=='all').map(x=>`<option value="${x[0]}" ${kind===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div id="kindFields">${fields(kind,{},null)}</div>`;$('saveBtn').textContent='保存';$('modal').classList.add('show')}
function changeKind(){let k=$('f_kind').value;$('kindFields').innerHTML=fields(k,{},null)}
function editItem(id){let x=items.find(a=>a.id===id);if(!x)return;editing=x;$('modalTitle').textContent='编辑'+kindLabel(x.kind);$('modalBody').innerHTML=`<input id="f_kind" type="hidden" value="${x.kind}">${fields(x.kind,meta(x),x)}`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
async function saveItem(){let kind=$('f_kind').value,title=$('f_title').value.trim();if(!title){alert('请填写名称');return}let m=editing?{...meta(editing)}:{};['url','password','price','browser','icon','siteName','siteUrl','secret','author'].forEach(k=>{let el=$('f_'+k);if(el)m[k]=el.value});if($('f_links'))m.links=$('f_links').value.split(',').map(x=>x.trim()).filter(Boolean);let content=$('f_content')?.value||editing?.content||'';let file=$('f_file')?.files?.[0];let tags=$('f_tags').value.split(',').map(x=>x.trim()).filter(Boolean);let payload={user_id:user.id,title,kind,content,category:$('f_category').value.trim()||null,tags,metadata:m,updated_at:new Date().toISOString()};if(file){let path=`${user.id}/${Date.now()}-${file.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,'_')}`;let up=await sb.storage.from('private-vault').upload(path,file,{upsert:false});if(up.error){alert('文件上传失败：'+up.error.message);return}payload.object_path=path;m.fileName=file.name;m.fileType=file.type;m.fileSize=file.size;if(kind==='worldbook'||kind==='persona'){if(file.type.startsWith('text')||/\.(json|txt|md|xml|ya?ml)$/i.test(file.name)){content=await file.text();payload.content=content}}}
let r=editing?await sb.from('vault_items').update(payload).eq('id',editing.id).eq('user_id',user.id):await sb.from('vault_items').insert(payload);if(r.error){alert('保存失败：'+r.error.message);return}closeModal();await loadItems()}
async function deleteItem(id){if(!confirm('确定移入回收站？当前版本暂按删除处理，建议先备份。'))return;let r=await sb.from('vault_items').delete().eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);else loadItems()}
async function copyItem(id){let x=items.find(a=>a.id===id);await navigator.clipboard.writeText([x.title,x.content,JSON.stringify(meta(x))].join('\n'));alert('已复制')}
async function toggleFav(id){let x=items.find(a=>a.id===id),m={...meta(x),favorite:!meta(x).favorite};let r=await sb.from('vault_items').update({metadata:m,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);else loadItems()}
function openExternal(id){let x=items.find(a=>a.id===id),m=meta(x),url=m.siteUrl||m.url;if(!url){alert('没有填写网址');return}if(!/^https?:\/\//i.test(url))url='https://'+url;let b=m.browser||'系统默认';if(b==='Chrome'&&/Android/i.test(navigator.userAgent)){let u=url.replace(/^https?:\/\//,'');location.href='intent://'+u+'#Intent;scheme=https;package=com.android.chrome;end';return}if(b==='Edge'&&/Android/i.test(navigator.userAgent)){location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.microsoft.emmx;end';return}window.open(url,'_blank','noopener')}
function newCategory(){let c=prompt('输入新分类名称');if(!c)return;alert('创建分类时请在对应条目的“分类”栏填写：'+c)}
async function previewFont(id){let x=items.find(a=>a.id===id);if(!x.object_path){alert('该字体尚未上传文件');return}let d=await sb.storage.from('private-vault').download(x.object_path);if(d.error){alert(d.error.message);return}let u=URL.createObjectURL(d.data),face=new FontFace('QVPreview','url('+u+')');await face.load();document.fonts.add(face);$('modalTitle').textContent='字体预览 · '+x.title;$('modalBody').innerHTML=`<div class="formrow"><label>预览文字</label><input id="pvText" value="${esc(x.content||'你好 QuietVault 123 ABC，。！？')} " oninput="$('pv').textContent=this.value"></div><div id="pv" class="preview" style="font-family:QVPreview">你好 QuietVault 123 ABC，。！？</div><button onclick="applyFont('${id}')">应用到 QuietVault</button>`;$('saveBtn').classList.add('hidden');$('modal').classList.add('show');window.qvFontUrl=u}
async function applyFont(id){let x=items.find(a=>a.id===id);let d=await sb.storage.from('private-vault').download(x.object_path);if(d.error)return alert(d.error.message);let u=URL.createObjectURL(d.data),face=new FontFace('QVSite','url('+u+')');await face.load();document.fonts.add(face);document.body.style.fontFamily='QVSite,system-ui';localStorage.setItem('qv_font_applied',id);alert('已应用于当前页面；刷新后需重新加载字体。')}
function openSettings(){let c=cfg();$('modalTitle').textContent='设置';$('modalBody').innerHTML=`<div class="notice">连接配置保存在本浏览器。不要填写 service_role 密钥。</div><label>Supabase URL</label><input id="surl" value="${esc(c.url)}"><label>Publishable / anon key</label><input id="skey" value="${esc(c.key)}"><div class="formrow"><button onclick="saveSettings()">保存连接</button><button onclick="backupJSON()">导出 JSON 备份</button></div><div class="formrow"><label>导入文件（通用文本）</label><input id="backupFile" type="file" accept=".json,.txt,.md,.xml,.yaml,.yml"></div>`;$('saveBtn').classList.add('hidden');$('modal').classList.add('show')}
function saveSettings(){localStorage.setItem('qv_url',$('surl').value.trim());localStorage.setItem('qv_key',$('skey').value.trim());alert('连接配置已保存；重新登录后生效');location.reload()}
function backupJSON(){let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='QuietVault-backup.json';a.click()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.addEventListener('load',async()=>{let c=cfg();$('cfgUrl').value=c.url;$('cfgKey').value=c.key;initClient();if(sb){let r=await sb.auth.getSession();if(r.data.session)enterApp()}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script></body></html>
